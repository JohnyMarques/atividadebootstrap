<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botstrap em ação</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <link rel="stylesheet" href="mains.css">
</head>

<body>

    <main class="container d-flex flex-column justify-content-center config-corpo">


        <h2 class="mb-3">Formulário</h2>

        <form id="meuFormulario" class="needs-validation" novalidate>

            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" name="nome" id="nome" class="form-control" autofocus autocomplete="name"
                    minlength="3" required>
                <div class="invalid-feedback">
                    O nome deve ter pelo menos 3 caracteres.
                </div>
            </div>


            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" name="email" id="email" class="form-control" autocomplete="email" required>
                <div class="invalid-feedback">
                    Insira um e-mail válido.
                </div>
            </div>



            <div class="mb-3">
                <label for="telefone" class="form-label">Celular</label>
                <input type="tel" name="telefone" id="telefone" class="form-control" autocomplete="tel" required>
                <div class="invalid-feedback">
                    Insira um telefone válido com 11 dígitos.
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Enviar</button>

        </form>
    </main>

    <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="successModalLabel">Tudo pronto!</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    Seu cadastro foi enviado com sucesso!
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>



    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script> 
    
</body>

</html>
